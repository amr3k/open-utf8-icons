<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="open-utf8-icons" />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.ico"
      sizes="16x16 32x32 48x48"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="%sveltekit.assets%/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%sveltekit.assets%/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%sveltekit.assets%/favicon-16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%sveltekit.assets%/icons/apple-touch-icon.png"
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="utf8 icons" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Capture the one-shot install event before hydration so the mobile
      // banner can still be offered when it fires while modules are loading.
      // Leave desktop Chromium's own install UI alone.
      window.addEventListener("beforeinstallprompt", function (event) {
        if (!window.matchMedia("(pointer: coarse)").matches) return;
        event.preventDefault();
        window.__utf8IconsInstallPrompt = event;
      });
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var isDark =
            stored === "dark" ||
            ((!stored || stored === "system") && prefersDark);
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.style.colorScheme = "light";
          }
          // Paint the browser chrome in the resolved theme before first paint;
          // the runtime manager updates it again when the mode changes.
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute("content", isDark ? "#09090b" : "#ffffff");
          }
        } catch (_) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="bg-white text-zinc-900 transition-colors duration-150 antialiased selection:bg-zinc-200 selection:text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 dark:selection:bg-zinc-800 dark:selection:text-zinc-100"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
