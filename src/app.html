<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="open-utf8-icons — High-performance, ad-free web directory for discovering, previewing, and copying native UTF-8 and Unicode glyphs."
    />
    <title>open-utf8-icons — Discover & Copy UTF-8 Unicode Glyphs</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var isDark =
            stored === "dark" ||
            ((!stored || stored === "system") && prefersDark);
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.style.colorScheme = "light";
          }
        } catch (_) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="bg-white text-zinc-900 transition-colors duration-150 antialiased selection:bg-zinc-200 selection:text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 dark:selection:bg-zinc-800 dark:selection:text-zinc-100"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
