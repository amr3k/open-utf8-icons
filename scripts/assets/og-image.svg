  <!-- Footer line -->
  <text x="80" y="612" font-family="'DejaVu Sans', 'Noto Sans', sans-serif" font-size="18" fill="#52525b">Free &amp; open source · No ads · Instant offline search · MIT</text>
  <text x="1120" y="612" text-anchor="end" font-family="'DejaVu Sans', 'Noto Sans', sans-serif" font-size="18" fill="#52525b">Unicode 16.0.0</text>
