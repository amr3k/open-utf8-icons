<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Open UTF-8 icons — discover, preview and copy native UTF-8 glyphs at utf8.a3k.me">
  <!--
    Source for static/og-image.png (Phase 6 of #1). Render with:
    rsvg-convert -w 1200 -h 630 scripts/assets/og-image.svg -o static/og-image.png
    optipng -o5 static/og-image.png
  -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#09090b"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="330" cy="210" rx="430" ry="330" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Brand mark -->
  <rect x="80" y="72" width="148" height="148" rx="36" fill="#18181b" stroke="#27272a" stroke-width="2"/>
  <rect x="80" y="72" width="148" height="148" rx="36" fill="url(#sheen)"/>
  <text x="154" y="176" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Noto Serif CJK JP', 'DejaVu Sans', sans-serif" font-size="104" font-weight="700" fill="#38bdf8">ツ</text>

  <!-- Copy -->
  <text x="80" y="306" font-family="'DejaVu Sans', 'Noto Sans', sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#38bdf8">UTF-8 / UNICODE GLYPH DIRECTORY</text>
  <text x="78" y="382" font-family="'DejaVu Sans', 'Noto Sans', sans-serif" font-size="56" font-weight="700" fill="#fafafa">Open UTF-8 icons</text>
  <text x="80" y="438" font-family="'DejaVu Sans', 'Noto Sans', sans-serif" font-size="27" fill="#a1a1aa">Discover, preview &amp; copy 4,021 native</text>
  <text x="80" y="476" font-family="'DejaVu Sans', 'Noto Sans', sans-serif" font-size="27" fill="#a1a1aa">UTF-8 and Unicode glyphs — offline.</text>

  <!-- URL pill -->
